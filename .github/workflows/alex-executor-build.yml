name: Build and prerelease ALEX Executor
on:
  push:
    branches: [alex-executor-starter]
    paths:
      - 'ALEX-Executor/src/**'
      - 'ALEX-Executor/install/**'
      - 'ALEX-Executor/scripts/generate_icons.py'
      - 'ALEX-Executor/package.json'
      - '.github/workflows/alex-executor-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alex-executor-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac-both
          - os: windows-latest
            label: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        working-directory: ALEX-Executor
        shell: bash
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify ALEX desktop icons
        working-directory: ALEX-Executor
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate_icons.py
          test -s build/icon.icns
          test -s build/icon.ico
      - name: Install dependencies
        working-directory: ALEX-Executor
        run: npm install --no-audit --no-fund
      - name: Package macOS Apple Silicon + Intel apps on one runner
        if: runner.os == 'macOS'
        working-directory: ALEX-Executor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npm run dist:mac:arm64
          npm run dist:mac:x64
      - name: Package Windows x64 app
        if: runner.os == 'Windows'
        working-directory: ALEX-Executor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win:x64
      - name: Hash macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd ALEX-Executor/dist
          shopt -s nullglob
          files=(ALEX-Executor-mac-*.zip)
          test "${#files[@]}" -eq 2
          for f in "${files[@]}"; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: Hash Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem ALEX-Executor/dist -Filter 'ALEX-Executor-Setup-x64.exe')
          if ($files.Count -ne 1) { throw 'Expected one x64 installer' }
          foreach ($file in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText($file.FullName + '.sha256', "$h  $($file.Name)")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ALEX-${{ matrix.label }}
          path: |
            ALEX-Executor/dist/ALEX-Executor-mac-*.zip
            ALEX-Executor/dist/ALEX-Executor-Setup-x64.exe
            ALEX-Executor/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  prerelease:
    name: Publish unsigned desktop starter
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ALEX-*
          path: release-assets
          merge-multiple: true
      - name: Check the six files and their SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for asset in ALEX-Executor-mac-arm64.zip ALEX-Executor-mac-x64.zip ALEX-Executor-Setup-x64.exe; do
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum -c "$asset.sha256"
          done
      - name: Publish tagged prerelease (no overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=alex-executor-v0.1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite binaries."
            exit 0
          fi
          gh release create "$TAG" \
            release-assets/ALEX-Executor-mac-arm64.zip \
            release-assets/ALEX-Executor-mac-arm64.zip.sha256 \
            release-assets/ALEX-Executor-mac-x64.zip \
            release-assets/ALEX-Executor-mac-x64.zip.sha256 \
            release-assets/ALEX-Executor-Setup-x64.exe \
            release-assets/ALEX-Executor-Setup-x64.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title 'ALEX Executor v0.1.0 - Desktop Starter (not a Roblox injector)' \
            --notes 'Unsigned starter: Luau text editor/open/save only. No Roblox Player attach or execution engine. Check your downloads and OS security warnings.' \
            --prerelease
